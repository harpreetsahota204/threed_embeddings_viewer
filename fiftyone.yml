name: "@harpreetsahota/threed-embeddings"
description: "Interactive embeddings visualization panel (2D/3D) with lasso selection, hover previews, and a class legend"
version: "1.0.0"
fiftyone:
  version: ">=0.23.0"
license: "Apache 2.0"
author: "Harpreet Sahota"

# Python operators
operators:
  - load_visualization_results
  - get_plot_colors
  - get_view_samples
  - get_sample_filepath

# TypeScript/React panels
panels:
  - ThreeDEmbeddingsPanel

# JavaScript bundle for panels
js_bundle: dist/index.umd.js
